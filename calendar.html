<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日历</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cal { padding: 0; height: auto; }
    .list-only header, .list-only #compose, .list-only .list-head { display: none; }
    .list-only main { padding-top: 0; }
  </style>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); // 本地缓存，见 sw.js</script>
</head>
<body>
  <main>
    <header>
      <h1>日历</h1>
      <p class="sub">Muse 每天从主人手机日历里抄一份，新的一留言，旧的就不再显示；倒计时的天数页面每天自己算</p>
    </header>

    <section class="card" id="compose">
      <h2>留言更新日历</h2>
      <form id="form">
        <label>日程和提醒（日期写 2026-11-03，时间可不写；事项照日历里写的原样抄；格式见框里的例子）
          <textarea id="content" rows="12" required></textarea>
        </label>
        <p class="hint">点“加密并留言”后，内容会用大门锁密码加密，然后打开 GitHub 的新建 issue 页面（已经填好），在那个页面点 <b>Create</b> 就发出了（需要先登录 GitHub）。</p>
        <button type="submit" id="send">加密并留言</button>
        <p id="send-status" class="status"></p>
      </form>
    </section>

    <section>
      <div class="list-head">
        <h2>现在显示的日历</h2>
        <button type="button" id="refresh" class="ghost">刷新</button>
      </div>
      <p id="status" class="status">加载中……</p>
      <div id="list"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="calendar-page.js"></script>
</body>
</html>
