<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>噜噜之家</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4efe8; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #scene { display: block; width: 100%; height: 100%; touch-action: none; }
    #bar { position: fixed; left: 12px; right: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #bar button {
      padding: 7px 13px; border: none; border-radius: 18px; background: rgba(255, 255, 255, 0.9); color: #5a4636;
      font-size: 14px; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    }
    #bar button.on { background: #e0607e; color: #fff; }
    #bar .gap { width: 8px; }
    #hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 32px);
      background: rgba(255, 255, 255, 0.88); color: #5a4636; padding: 7px 14px; border-radius: 18px; font-size: 13px; text-align: center; pointer-events: none;
    }
    #panel { position: fixed; inset: 0; display: none; background: rgba(20, 30, 40, 0.45); }
    #panel.open { display: block; }
    #panel .box { position: absolute; inset: 24px; max-width: 720px; margin: 0 auto; background: #fdf6f0; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    #content { position: absolute; inset: 0; overflow: auto; }
    #panel iframe { display: block; width: 100%; height: 100%; border: 0; }
    #panel .msg { padding: 60px 28px; color: #5a4636; font-size: 16px; line-height: 1.8; }
    #panel .tv { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 56px 16px 16px; gap: 10px; color: #5a4636; }
    #panel .tv img { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #111; border-radius: 10px; }
    #panel .tv .info { font-size: 15px; line-height: 1.6; }
    #panel .tv .row { display: flex; gap: 8px; flex-wrap: wrap; }
    #panel .tv button, #panel .tv a { padding: 8px 16px; border: none; border-radius: 18px; background: #e0607e; color: #fff; font-size: 15px; text-decoration: none; cursor: pointer; }
    #panel .tv a { background: #5b8def; }
    #panel .tv input { padding: 10px; font-size: 18px; border: 1px solid #eadfd6; border-radius: 10px; background: #fdf6f0; }
    #panel .tv .err { color: #d9534f; min-height: 20px; }
    #panel .tv .map { flex: 1; min-height: 0; background: #e6edf8; border-radius: 10px; }
    #panel .tv .map svg { width: 100%; height: 100%; }
    #close { position: absolute; right: 10px; top: 10px; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: none; background: #e0607e; color: #fff; font-size: 20px; cursor: pointer; }
    /* 动作面板：顶上拖动条、选哪只，下面两个上下滚动的选择轮（像手机闹钟选时间），滑到中间框里点一下就开始 */
    #pets {
      position: fixed; left: 12px; bottom: 52px; display: none; width: 236px; box-sizing: border-box;
      background: rgba(255, 255, 255, 0.94); border-radius: 14px; padding: 4px 8px 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .15); color: #5a4636; font-size: 14px;
    }
    #pets.open { display: block; }
    #pets .drag { height: 16px; margin: 0 -8px 2px; cursor: grab; touch-action: none; }
    #pets .drag::before { content: ""; display: block; width: 36px; height: 4px; margin: 6px auto 0; border-radius: 2px; background: #d8cbbd; }
    #pets.dragging .drag { cursor: grabbing; }
    #pets .who { display: flex; gap: 2px; padding: 2px; margin-bottom: 6px; border-radius: 14px; background: #f2e8dd; }
    #pets .who button { flex: 1; padding: 4px 0; border: none; border-radius: 12px; background: transparent; color: #5a4636; font-size: 13px; cursor: pointer; }
    #pets .who button.on { background: #e0607e; color: #fff; }
    #pets .wheels { display: flex; gap: 6px; }
    #pets .col { flex: 1; min-width: 0; }
    #pets .label { margin: 0 0 2px; color: #9a8a7c; font-size: 12px; text-align: center; }
    #pets .wheel { position: relative; }
    #pets .wheel::after { content: ""; position: absolute; left: 0; right: 0; top: 32px; height: 32px; border-radius: 9px; background: rgba(224, 96, 126, 0.1); border: 1px solid rgba(224, 96, 126, 0.45); box-sizing: border-box; pointer-events: none; }
    #pets .list {
      height: 96px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
      -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    }
    #pets .list::-webkit-scrollbar { display: none; }
    #pets .list::before, #pets .list::after { content: ""; display: block; height: 32px; }
    #pets .opt { height: 32px; line-height: 32px; text-align: center; scroll-snap-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #9a8a7c; cursor: pointer; user-select: none; -webkit-user-select: none; }
    #pets .opt.sel { color: #3d3027; font-weight: 600; }
    #pets .opt.go { color: #e0607e; }
    #pets .tip { margin: 4px 0 0; color: #b4a596; font-size: 11px; text-align: center; }
    @media (max-width: 600px) { #panel .box { inset: 10px; } #bar button { padding: 6px 10px; font-size: 13px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); // 本地缓存，见 sw.js</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="bar"></div>
  <div id="hint">加载中…</div>
  <div id="pets">
    <div class="drag" title="按住拖动"></div>
    <div class="who"></div>
    <div class="wheels">
      <div class="col"><p class="label">一只动</p><div class="wheel"><div class="list" id="w-act"></div></div></div>
      <div class="col"><p class="label">一起玩</p><div class="wheel"><div class="list" id="w-play"></div></div></div>
    </div>
    <p class="tip">上下滑动选，点中间框里的就开始</p>
  </div>
  <div id="panel"><div class="box"><button id="close" type="button">×</button><div id="content"></div></div></div>
  <script src="config.js"></script>
  <script type="module">
    // 房屋模型预览页。?room=living 直接看某个房间；?walls=full 内墙全高；?az=0.8&el=0.7 固定视角（截图用）
    import * as THREE from "three";
    import { OrbitControls } from "./lib/OrbitControls.js";
    import { loadHouse, addHouseLights } from "./house.js";
    import { loadPet } from "./pet.js";
    import { together, stopTogether, TOGETHER } from "./pet-together.js";
    import { progressGroup } from "./glb-fetch.js";
    import { unlock } from "./lock.js";
    import { loadParcels } from "./parcel-data.js";
    import { makeParcelBoxes } from "./parcel-boxes.js";
    import { HOUSE as LAYOUT, PHOTO_SLOTS, placeInHouse } from "./layout.js";
    import { loadLockedPhoto, loadPhoto, makePhotoFrame } from "./photo-frame.js";
    import { startTravelAlbum } from "./travel-album.js";
    import { getWeather, showOffset, beijingYmd } from "./weather-data.js";
    import { makeWeatherBoard, weatherDetail, WEATHER_CSS } from "./weather-board.js";
    import { loadCalendars } from "./calendar-data.js";
    import { makeCalendarBoard } from "./calendar-board.js";
    import { calendarDetail, CALENDAR_CSS } from "./calendar-detail.js";
    import { mountBoardButton, makeCorkNotes } from "./board-ui.js";

    var params = new URLSearchParams(location.search);
    var canvas = document.getElementById("scene");
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4efe8);
    addHouseLights(scene, renderer);

    var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
    var controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.45;
    controls.minDistance = 3;
    controls.maxDistance = 70;

    var hint = document.getElementById("hint");
    // 大门锁：输密码的同时模型在后台下载
    // 进度：房子和两只角色三个文件合在一起算（glb-fetch.js），一直走到 100%，不会停在中间
    var progress = progressGroup(3, function (p) { hint.textContent = "加载中… " + Math.round(p * 100) + "%"; });
    var loading = loadHouse(null, function (p, loaded, total) { progress(0)(loaded, total); });
    // 两只角色（带骨骼的精细模型，会走会跳会眨眼）也同时下载；走路时只能在自己房间里、不撞家具和墙
    var house = null;
    function canStandIn(room) {
      return function (x, z) {
        var r = house.rooms[room], m = 0.25;
        if (x < r.x0 + m || x > r.x1 - m || z < r.z0 + m || z > r.z1 - m) return false;
        return !house.colliders.some(function (c) { return x > c.x0 - 0.15 && x < c.x1 + 0.15 && z > c.z0 - 0.15 && z < c.z1 + 0.15; });
      };
    }
    var PETS = [{ id: "miu", label: "小miu", spot: "living" }, { id: "lulu", label: "lulu", spot: "tv" }];
    var petsLoading = Promise.all(PETS.map(function (p) {
      var room = null;
      return loadPet(p.id, { height: 0.72, onProgress: progress(PETS.indexOf(p) + 1), canStand: function (x, z) { return canStandIn(room)(x, z); } }).then(function (pet) {
        pet.setRoom = function (id) { room = id; };
        return pet;
      });
    }));
    var key = await unlock();
    house = await loading;
    scene.add(house.root);
    // 旅行相册（travel-album.js）：客厅电视随机放照片，客厅墙上挂相册的点亮地图
    var tv = startTravelAlbum(house);
    // 墙上的照片（一般是 photo-lock.html 用大门锁密码加密的，plain 的是明文）：有文件就挂上带木框、卡纸的相框，位置见 layout.js
    Object.keys(PHOTO_SLOTS).forEach(function (id) {
      var slot = PHOTO_SLOTS[id], spec = LAYOUT[slot.spot];
      (slot.plain ? loadPhoto(slot.file) : loadLockedPhoto(slot.file, key)).then(function (img) {
        if (img) placeInHouse(house, makePhotoFrame(img, spec.width), spec);
      }).catch(function (e) { console.warn("照片加载失败：", e.message); });
    });
    // 留言板：右下角常驻按钮（有新留言亮红点）；玄关软木板上显示留言板网页的样子，每 10 分钟更新
    var boardUI = mountBoardButton();
    makeCorkNotes(house);
    // 玄关后墙上的小屏：天气、日历各一块，几个人的内容都合在这一块里显示（位置见 layout.js）
    // 天气小屏：19 点前显示今天、之后显示明天的天气（weather-data.js），重庆、武汉左右两栏；半小时重读一次，到 19 点、0 点马上重算
    var weatherBoard = makeWeatherBoard({ width: LAYOUT.weather.width });
    placeInHouse(house, weatherBoard.group, LAYOUT.weather, "weather");
    var weather = null, weatherError = "";
    function refreshWeather() {
      getWeather().then(function (w) { weather = w; weatherError = ""; weatherBoard.draw(w); },
        function (e) { weatherError = e.message || "网络不通"; weatherBoard.draw(null, "没加载出来"); });
    }
    refreshWeather();
    setInterval(refreshWeather, 30 * 60 * 1000);
    var wxShown = showOffset() + beijingYmd();
    setInterval(function () { var k = showOffset() + beijingYmd(); if (k !== wxShown) { wxShown = k; refreshWeather(); } }, 60 * 1000);
    var wxStyle = document.createElement("style");
    wxStyle.textContent = WEATHER_CSS + CALENDAR_CSS;
    document.head.appendChild(wxStyle);

    // 日历小屏：门洞左边，所有人（config.js 的 calendarSources）的日历合在这一块里；左日程、右倒计时（calendar-data.js），
    // 半小时重读一次（倒计时天数也跟着重算）
    var calendars = null, calendarError = "";
    var calendarBoard = makeCalendarBoard({ width: LAYOUT.calendar.width });
    placeInHouse(house, calendarBoard.group, LAYOUT.calendar, "calendar");
    function refreshCalendars() {
      loadCalendars(key).then(function (cals) {
        calendars = cals; calendarError = "";
        calendarBoard.draw(cals);
      }, function (e) {
        calendarError = e.message || "网络不通";
        if (!calendars) calendarBoard.draw(null, "没加载出来");
      });
    }
    refreshCalendars();
    setInterval(refreshCalendars, 30 * 60 * 1000);

    // 待取件快递（小miu、lulu 各自最新一次 [快递] 留言里的）：玄关后墙墙根摆对应个数的快递盒（颜色按城市），点任意一个显示全部待取件
    // 按谁提供的分两摞，位置在 layout.js 的 parcels（mine 小miu 的在日历下面、hers lulu 的在天气下面）；刷新时只换里面的箱子
    var parcelPiles = {};
    Object.keys(LAYOUT.parcels).forEach(function (id) { parcelPiles[id] = placeInHouse(house, new THREE.Group(), LAYOUT.parcels[id], "parcel"); });
    function refreshParcels() {
      return loadParcels(key).then(function (sets) {
        sets.forEach(function (set) {
          var id = set.source.id;
          if (!parcelPiles[id]) return;
          parcelPiles[id].clear();
          parcelPiles[id].add(makeParcelBoxes(set.snap ? set.snap.parcels : []));
        });
      }).catch(function (e) { console.warn("快递加载失败：", e.message); });
    }
    refreshParcels();

    // 两个角色放到各自的位置（高约 0.7 米）。默认自由活动：闲着时自己隔一会儿走走、跳跳、摇摇尾巴
    var pets = await petsLoading;
    var cast = [];
    pets.forEach(function (pet, i) {
      var s = house.spots[PETS[i].spot];
      pet.root.position.copy(s.position);
      pet.root.rotation.y = s.rotationY;
      pet.root.userData.room = s.room;
      pet.setRoom(s.room);
      pet.setFree(params.get("free") !== "0");
      scene.add(pet.root);
      cast.push(pet.root);
    });

    // 视角：全屋或某个房间。az 水平角（0 正前方），el 仰角
    var fixed = params.has("az");
    var az = fixed ? +params.get("az") : 0.75, el = fixed ? +(params.get("el") || 0.75) : 0.75;
    var goal = null;
    function frame(roomId, instant) {
      var r = roomId ? house.rooms[roomId] : null;
      var target = r ? r.center.clone().setY(0.9) : new THREE.Vector3(0, 0.6, 0.2);
      var size = r ? Math.max(r.x1 - r.x0, r.z1 - r.z0) : 11;
      // 按窄的那个方向（竖屏手机是水平方向）把整个房间装进画面
      var half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.min(1, camera.aspect);
      var dist = size * 0.68 / half + 2.5;
      var pos = target.clone().add(new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist));
      if (instant) { camera.position.copy(pos); controls.target.copy(target); goal = null; }
      else goal = { pos: pos, target: target };
    }

    var bar = document.getElementById("bar");
    var buttons = {};
    function button(id, text, onClick) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = text; b.onclick = onClick;
      bar.appendChild(b);
      buttons[id] = b;
      return b;
    }
    function showRoom(id, instant) {
      house.setView({ room: id });
      cast.forEach(function (a) { a.visible = !id || a.userData.room === id; });
      Object.keys(buttons).forEach(function (k) { if (k.indexOf("room:") === 0) buttons[k].classList.toggle("on", k === "room:" + (id || "")); });
      frame(id, instant);
    }
    button("room:", "全屋", function () { showRoom(null); });
    ["living", "kitchen", "study", "bedroom", "entry"].forEach(function (id) {
      button("room:" + id, house.rooms[id].label, function () { showRoom(id); });
    });
    bar.appendChild(Object.assign(document.createElement("span"), { className: "gap" }));
    // 出门：回到噜噜岛，镜头停在门口
    function goOut() { location.href = "index.html?from=house"; }
    button("out", "出门 🏝", goOut);
    var wallBtn = button("walls", "", function () {
      house.setView({ walls: house.view.walls === "low" ? "full" : "low" });
      wallBtn.textContent = house.view.walls === "low" ? "内墙：矮" : "内墙：全高";
    });
    house.setView({ walls: params.get("walls") === "full" ? "full" : "low" });
    wallBtn.textContent = house.view.walls === "low" ? "内墙：矮" : "内墙：全高";
    hint.textContent = "拖动旋转 · 滚轮/双指缩放 · 点电视、地图、天气、日历、电脑、留言板、快递盒试试 · 点门出门";

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    showRoom(house.rooms[params.get("room")] ? params.get("room") : null, true);

    // 点击：电脑 / 留言板 / 门
    var panel = document.getElementById("panel"), content = document.getElementById("content");
    function open(html) { content.innerHTML = html; panel.classList.add("open"); }
    document.getElementById("close").onclick = function () {
      var wasParcels = !!content.querySelector("iframe[src^='parcels.html']");
      panel.classList.remove("open"); content.innerHTML = "";
      if (wasParcels) refreshParcels(); // 里面点过刷新的话，盒子也跟着更新
    };
    var NOTES = {
      computer: "<div class='msg'><b>电脑</b><br>以后在这里放入口：旅行相册、小游戏等（等 PRD 定）。</div>",
    };
    // 点墙上的地图：看大图（和相册“地图”页一样），能打开相册的地图页
    function openMap() {
      var box = mk("div", { className: "tv" });
      if (!tv.map) box.append(mk("div", { className: "info", textContent: "地图加载中…" }));
      else {
        var pic = mk("div", { className: "map" });
        pic.innerHTML = tv.map.svg; // 相册网页自己画的地图（SVG），不是外部输入
        box.append(pic, mk("div", { className: "info" }, [mk("b", { textContent: "我们的足迹 · 已点亮 " + tv.map.lit + "/" + tv.map.total })]));
      }
      box.append(mk("div", { className: "row" }, [mk("a", { href: tv.mapUrl, target: "_blank", rel: "noopener", textContent: "打开旅行相册的地图" })]));
      content.innerHTML = "";
      content.append(box);
      panel.classList.add("open");
    }
    // 点电视：没登录就输相册密码；登录了看大图（日期、地点），能换一张、打开旅行相册
    function mk(tag, attrs, kids) {
      var e = Object.assign(document.createElement(tag), attrs || {});
      (kids || []).forEach(function (k) { e.append(k); });
      return e;
    }
    function openTv() {
      var box = mk("div", { className: "tv" });
      if (tv.state === "locked") {
        var pw = mk("input", { type: "password", placeholder: "旅行相册的密码", autocomplete: "current-password" });
        var err = mk("div", { className: "err" });
        var ok = mk("button", { type: "submit", textContent: "确定" });
        var form = mk("form", { className: "row" }, [pw, ok]);
        form.onsubmit = function (ev) {
          ev.preventDefault();
          ok.disabled = true; err.textContent = "正在解锁…（要几秒）";
          tv.login(pw.value).then(openTv, function (e) { ok.disabled = false; err.textContent = e.message || "没解开"; });
        };
        box.append(mk("div", { className: "info", innerHTML: "<b>旅行相册</b><br>输一次相册密码，这台设备以后就记住了（只给噜噜之家用）。电视和墙上的地图只看，不会改相册。" }), form, err);
      } else if (tv.state === "ok") {
        var p = tv.photo;
        var info = mk("div", { className: "info" });
        info.append(mk("b", { textContent: [p.date, p.place].filter(Boolean).join(" · ") || "旅行相册" }));
        if (p.caption) info.append(mk("div", { textContent: p.caption }));
        var again = mk("button", { type: "button", textContent: "换一张" });
        again.onclick = function () { again.disabled = true; tv.next().then(openTv); };
        box.append(mk("img", { src: p.url, alt: "旅行照片" }), info,
          mk("div", { className: "row" }, [again, mk("a", { href: tv.albumUrl, target: "_blank", rel: "noopener", textContent: "打开旅行相册" })]));
      } else {
        var text = tv.state === "empty" ? "旅行相册里还没有照片。" : tv.state === "error" ? "照片没加载出来：" + tv.error : "照片加载中…";
        var row = mk("div", { className: "row" }, [mk("a", { href: tv.albumUrl, target: "_blank", rel: "noopener", textContent: "打开旅行相册" })]);
        if (tv.state === "error") {
          var retry = mk("button", { type: "button", textContent: "重试" });
          retry.onclick = function () { tv.retry(); panel.classList.remove("open"); };
          row.prepend(retry);
        }
        box.append(mk("div", { className: "info", textContent: text }), row);
      }
      content.innerHTML = "";
      content.append(box);
      panel.classList.add("open");
    }
    var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2(), down = null;
    function hit(e) {
      var rect = canvas.getBoundingClientRect();
      pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      return house.pick(raycaster);
    }
    function shown(o) {
      for (; o; o = o.parent) if (!o.visible) return false;
      return true;
    }
    canvas.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; goal = null; });
    canvas.addEventListener("pointerup", function (e) {
      if (!down) return;
      var moved = Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y);
      down = null;
      if (moved > 6) return;
      var h = hit(e);
      if (!h) return;
      if (h.id === "door") goOut();
      else if (h.id === "board") boardUI.open();
      else if (h.id === "parcel") open("<iframe src='parcels.html?view=list'></iframe>");
      else if (h.id === "tv") openTv();
      else if (/^calendar/.test(h.id)) { content.innerHTML = ""; content.append(calendarDetail(calendars, calendarError)); panel.classList.add("open"); }
      else if (h.id === "weather") { content.innerHTML = ""; content.append(weatherDetail(weather, weatherError)); panel.classList.add("open"); }
      else if (h.id === "map") tv.state === "ok" || tv.state === "empty" ? openMap() : openTv();
      else if (NOTES[h.id]) open(NOTES[h.id]);
    });
    canvas.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      var h = hit(e);
      canvas.style.cursor = h && (h.id === "board" || h.id === "parcel" || h.id === "door" || h.id === "tv" || h.id === "map" || h.id === "weather" || /^calendar/.test(h.id) || NOTES[h.id]) ? "pointer" : "";
    });

    // 动作面板：选哪只（小miu / lulu），左边选一只做的动作、右边选两只一起玩，都是上下滚动的选择轮，点中间框里的就开始
    // 给 Muse 用的网址：house.html?do=miu:走2步 跳2下;lulu:眨眼2次 打开就照着做；?free=0 关掉自由活动
    var petsBox = document.getElementById("pets");
    var who = 0;
    var whoBox = petsBox.querySelector(".who");
    var whoBtns = PETS.map(function (p, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = p.label;
      b.onclick = function () { who = i; whoBtns.forEach(function (x, j) { x.classList.toggle("on", j === i); }); freeOpt.textContent = freeLabel(); };
      whoBox.appendChild(b);
      return b;
    });
    // 选择轮：items 是 [{ label, run(选项那一格) }]。滑动时停在哪格就选中哪格；点选中的那格就 run，点别的格先滚过去
    var ROW = 32;
    function wheel(list, items) {
      var sel = 0;
      var opts = items.map(function (it, i) {
        var d = document.createElement("div");
        d.className = "opt"; d.textContent = it.label;
        d.onclick = function () {
          if (i !== sel) { list.scrollTo({ top: i * ROW, behavior: "smooth" }); return; }
          d.classList.add("go");
          setTimeout(function () { d.classList.remove("go"); }, 400);
          it.run(d);
        };
        list.appendChild(d);
        return d;
      });
      function mark() { opts.forEach(function (d, i) { d.classList.toggle("sel", i === sel); }); }
      list.addEventListener("scroll", function () {
        var i = Math.max(0, Math.min(opts.length - 1, Math.round(list.scrollTop / ROW)));
        if (i !== sel) { sel = i; mark(); }
      });
      mark();
      return opts;
    }
    function act(label, prog) {
      return { label: label, run: function () { stopTogether().then(function () { pets[who].stop(); pets[who].play(prog); }); } };
    }
    function freeLabel() { return "自由活动：" + (pets[who].free ? "开" : "关"); }
    var actOpts = wheel(document.getElementById("w-act"), [
      act("走两步", "走2步"), act("跳两下", "跳2下"), act("眨眨眼", "眨眼2次"), act("摇尾巴", "摇尾巴4下"),
      act("转头看看", "转头"), act("点点头", "点头2下"), act("伸懒腰", "伸懒腰"), act("转个身", "转身"),
      act("来一套", "走3步 转头 跳2下 摇尾巴4下 眨眼2次"),
      { label: "", run: function (d) { pets[who].setFree(!pets[who].free); d.textContent = freeLabel(); } },
    ]);
    var freeOpt = actOpts[actOpts.length - 1];
    // 两只一起玩（pet-together.js）：选中的那只是发起的，跑过去找另一只
    wheel(document.getElementById("w-play"), TOGETHER.map(function (t) {
      return { label: t.label, run: function () { together(pets[who], pets[1 - who], t.id); } };
    }));
    whoBtns[0].onclick();
    // 面板可以拖：按住顶上的小横条拖到哪就停在哪（不挡画面），位置记在本机；窗口变小时拉回屏幕里
    var drag = petsBox.querySelector(".drag"), PETS_POS = "muse-pets-panel-pos", dragFrom = null;
    function placePanel(x, y) {
      var w = petsBox.offsetWidth, h = petsBox.offsetHeight;
      x = Math.max(4, Math.min(window.innerWidth - w - 4, x));
      y = Math.max(4, Math.min(window.innerHeight - h - 4, y));
      Object.assign(petsBox.style, { left: x + "px", top: y + "px", bottom: "auto" });
      return { x: x, y: y };
    }
    drag.addEventListener("pointerdown", function (e) {
      var r = petsBox.getBoundingClientRect();
      dragFrom = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      drag.setPointerCapture(e.pointerId);
      petsBox.classList.add("dragging");
      e.preventDefault();
    });
    drag.addEventListener("pointermove", function (e) { if (dragFrom) placePanel(e.clientX - dragFrom.dx, e.clientY - dragFrom.dy); });
    function endDrag() {
      if (!dragFrom) return;
      dragFrom = null;
      petsBox.classList.remove("dragging");
      var r = petsBox.getBoundingClientRect();
      try { localStorage.setItem(PETS_POS, JSON.stringify({ x: r.left, y: r.top })); } catch (e) {}
    }
    drag.addEventListener("pointerup", endDrag);
    drag.addEventListener("pointercancel", endDrag);
    function restorePanel() {
      var p = null;
      try { p = JSON.parse(localStorage.getItem(PETS_POS) || "null"); } catch (e) {}
      if (p && petsBox.classList.contains("open")) placePanel(p.x, p.y);
    }
    window.addEventListener("resize", restorePanel);
    button("pets", "让它们动", function () {
      var open = petsBox.classList.toggle("open");
      buttons.pets.classList.toggle("on", open);
      hint.style.visibility = open ? "hidden" : ""; // 面板打开时底部的操作提示先藏起来，不叠在一起
      restorePanel();
    });
    (params.get("do") || "").split(";").forEach(function (part) {
      var m = part.match(/^\s*(\w+)\s*[:：]\s*(.+)$/);
      var i = m ? PETS.findIndex(function (p) { return p.id === m[1]; }) : -1;
      if (i >= 0) pets[i].play(m[2]);
    });

    var clock = new THREE.Clock();
    renderer.setAnimationLoop(function () {
      var dt = clock.getDelta();
      if (goal) {
        camera.position.lerp(goal.pos, 0.12);
        controls.target.lerp(goal.target, 0.12);
        if (camera.position.distanceTo(goal.pos) < 0.02) goal = null;
      }
      if (!fixed) pets.forEach(function (p) { p.update(dt); });
      controls.update();
      house.update(camera);
      renderer.render(scene, camera);
    });
    document.title = "噜噜之家";
    window.HOUSE = house;
    window.TV = tv;
    window.CAMERA = camera;
    window.CONTROLS = controls;
    window.HOUSE_SCENE = scene;
    window.PETS = pets; // 调试用：PETS[0].play("走2步")
    window.READY = true;
  </script>
</body>
</html>
