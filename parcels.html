<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待取件快递</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .parcel { border: 1px solid var(--border); border-left: 8px solid var(--c); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background: var(--card); }
    .parcel .city { display: inline-block; padding: 0 10px; border-radius: 10px; background: var(--c); color: #fff; font-weight: 700; }
    .parcel .code { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .parcel dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
    .parcel dt { color: var(--muted); }
    .parcel dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
    .list-only header, .list-only #compose { display: none; }
    .list-only .list-head { padding-right: 52px; } /* 让出右上角，house.html 里的关闭叉叠在 iframe 上面 */
  </style>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); // 本地缓存，见 sw.js</script>
</head>
<body>
  <main>
    <header>
      <h1>待取件快递</h1>
      <p class="sub">显示 Muse 最新一次留言的待取件，新的一留言，旧的就不再显示</p>
    </header>

    <section class="card" id="compose">
      <h2>留言更新待取件</h2>
      <form id="form">
        <label>今天全部待取件（每件以【城市】开头，下面写取件码、取件地址、到件时间、物品；没有就写“今天没有待取件”）
          <textarea id="content" rows="12" required></textarea>
        </label>
        <p class="hint">点“加密并留言”后，内容会用大门锁密码加密，然后打开 GitHub 的新建 issue 页面（已经填好），在那个页面点 <b>Create</b> 就发出了（需要先登录 GitHub）。</p>
        <button type="submit" id="send">加密并留言</button>
        <button type="button" id="clear" class="ghost">一键清空</button>
        <p id="send-status" class="status"></p>
      </form>
    </section>

    <section>
      <div class="list-head">
        <h2>待取件</h2>
        <button type="button" id="refresh" class="ghost">刷新</button>
      </div>
      <p id="status" class="status">加载中……</p>
      <ol id="list" class="list"></ol>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="parcels-page.js"></script>
</body>
</html>
