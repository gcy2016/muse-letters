<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加密照片</title>
  <style>
    body { margin: 0; background: #fdf6f0; color: #2b2420; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 18px 40px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p { line-height: 1.7; color: #5a4636; }
    .card { background: #fff; border: 1px solid #eadfd6; border-radius: 14px; padding: 16px; margin: 16px 0; }
    select, input[type=file] { font-size: 16px; }
    button, a.btn { display: inline-block; margin-top: 12px; padding: 10px 18px; border: none; border-radius: 20px; background: #e0607e; color: #fff; font-size: 16px; text-decoration: none; cursor: pointer; }
    img { display: block; max-width: 100%; max-height: 50vh; margin-top: 12px; border-radius: 10px; }
    #status { color: #8a7d74; }
  </style>
</head>
<body>
<main>
  <h1>加密照片</h1>
  <p>把要挂进噜噜之家的照片用<b>大门锁密码</b>加密。仓库是公开的，加密后存进去的是乱码，只有开过大门锁的人在屋里才看得到。</p>
  <div class="card">
    <label>挂在哪：
      <select id="slot"></select>
    </label>
    <p><input id="file" type="file" accept="image/*"></p>
    <p id="status">选一张照片。会先让你输大门锁密码（这台设备输过就不用再输）。</p>
    <img id="preview" alt="" hidden>
    <a id="save" class="btn" hidden>下载加密文件</a>
  </div>
  <p>下载下来的文件（名字像 <code>photo-living.enc</code>）按草稿 Release 的方式传到 file-storage，把标签名告诉 Claude，它会放进仓库 <code>assets/house/photos/</code>。照片在浏览器里先缩小（长边 1600 像素）再加密，原图不会上传到任何地方。</p>
</main>
<script src="config.js"></script>
<script type="module">
  import { unlock, encryptBytes } from "./lock.js";
  import { PHOTO_SLOTS } from "./layout.js";

  var slot = document.getElementById("slot"), status = document.getElementById("status");
  Object.keys(PHOTO_SLOTS).forEach(function (id) {
    slot.append(Object.assign(document.createElement("option"), { value: id, textContent: PHOTO_SLOTS[id].label }));
  });
  document.getElementById("file").onchange = async function (e) {
    var f = e.target.files[0];
    if (!f) return;
    try {
      var key = await unlock({ cancelable: true });
      if (!key) { status.textContent = "没输密码，没有加密。"; return; }
      status.textContent = "正在缩小、加密……";
      var img = await createImageBitmap(f, { imageOrientation: "from-image" });
      var k = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var jpg = await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.88); });
      var bin = await encryptBytes(key, new Uint8Array(await jpg.arrayBuffer()));
      var preview = document.getElementById("preview");
      preview.src = URL.createObjectURL(jpg); preview.hidden = false;
      var save = document.getElementById("save");
      save.href = URL.createObjectURL(new Blob([bin], { type: "application/octet-stream" }));
      save.download = "photo-" + slot.value + ".enc";
      save.textContent = "下载加密文件（" + save.download + "，" + Math.round(bin.length / 1024) + " KB）";
      save.hidden = false;
      status.textContent = "加密好了：" + c.width + "×" + c.height + " 像素。";
    } catch (err) {
      status.textContent = "出错了：" + (err.message || err);
    }
  };
</script>
</body>
</html>
