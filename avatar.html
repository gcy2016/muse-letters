<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>角色 3D 形象</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f1ea; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #scene { display: block; width: 100%; height: 100%; touch-action: none; }
    #hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); color: #8a7563; font-size: 14px; white-space: nowrap; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">拖动旋转 · 滚轮/双指缩放</div>
  <script type="module">
    // 单独看角色模型的预览页。?who=miu|lulu 选角色（默认小miu）；?angle=front|side|three-quarter|back 固定视角（截图对照参考图用）
    import * as THREE from "three";
    import { OrbitControls } from "./lib/OrbitControls.js";
    import { createMiu } from "./miu.js";
    import { createLulu } from "./lulu.js";

    var canvas = document.getElementById("scene");
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6f1ea);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb9a48f, 1.1));
    var sun = new THREE.DirectionalLight(0xfff2d6, 1.5);
    sun.position.set(3, 6, 4);
    sun.castShadow = true;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);
    var floor = new THREE.Mesh(new THREE.CircleGeometry(3, 40), new THREE.MeshStandardMaterial({ color: 0xeee3d4, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    var params = new URLSearchParams(location.search);
    var isLulu = params.get("who") === "lulu";
    var avatar = isLulu ? createLulu() : createMiu();
    scene.add(avatar);
    document.title = (isLulu ? "lulu" : "小miu") + " 3D 形象";
    document.getElementById("hint").textContent = (isLulu ? "lulu" : "小miu") + " · 拖动旋转 · 滚轮/双指缩放";

    var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    var angles = { front: 0, "three-quarter": -0.7, side: -Math.PI / 2, back: Math.PI };
    var a = angles[params.get("angle")];
    var fixed = a !== undefined;
    if (!fixed) a = -0.6;
    camera.position.set(Math.sin(a) * 4.2, 1.5, Math.cos(a) * 4.2);
    var controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.8, 0);
    controls.enableDamping = true;
    controls.autoRotate = !fixed;
    controls.autoRotateSpeed = 1.2;
    controls.minDistance = 2;
    controls.maxDistance = 9;

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    canvas.addEventListener("pointerdown", function () { controls.autoRotate = false; });

    var clock = new THREE.Clock();
    renderer.setAnimationLoop(function () {
      if (!fixed) avatar.userData.animate(clock.getElapsedTime());
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
