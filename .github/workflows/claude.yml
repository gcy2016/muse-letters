# lulu（xy123646）或 gcy2016 在帖子正文 / 评论里写 /claude，就自动启动 Claude 回复。
# 用噜噜小兵的 Claude 订阅登录（仓库 Secrets 里的 CLAUDE_CODE_OAUTH_TOKEN，用 claude setup-token 生成），不用 API。
# 规则见 AI_TEAM.md「补充成员说明：lulu」：只回答问题、生成文件，不改仓库（contents 只给读权限）。
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    # 只认这两个账号，陌生人写 /claude 不会启动，也不花额度
    if: |
      contains(fromJSON('["gcy2016","xy123646"]'), github.event.sender.login) &&
      ((github.event_name == 'issues' && contains(github.event.issue.body, '/claude')) ||
       (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: mkdir -p outputs

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          trigger_phrase: "/claude"
          # 只把成员和自己的评论交给 Claude，陌生人在帖子下的评论不读
          include_comments_by_actor: "gcy2016,xy123646,github-actions[bot]"
          claude_args: |
            --allowedTools "Bash(python3:*),Bash(pip install:*),Bash(pip3 install:*),Bash(mkdir:*),Bash(ls:*),Bash(gh issue view:*)"
            --append-system-prompt "你在 GitHub Actions 里运行，回复第一行写 Claude留言，遵守 AI_TEAM.md 的补充成员说明：lulu。交付文件放进仓库根目录的 outputs 文件夹，运行结束后会自动作为附件上传；回复里告诉对方：打开 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ，在页面最下面 Artifacts 处下载 claude-outputs（需登录 GitHub，保留 30 天）。帖子正文写着「回复 #编号」时，先用 gh issue view 编号 --comments 读那个帖子，接上前面的对话。"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-outputs
          path: outputs/
          if-no-files-found: ignore
          retention-days: 30
